[uwsgi]
module = app.main
callable = app
uid = nobody
gid = nogroup

# Socket configuration (CRITICAL - was missing!)
socket = /tmp/uwsgi.sock
chmod-socket = 666
vacuum = true

# Process management
master = true
processes = 4
die-on-term = true

# Buffer settings
buffer-size = 65535
post-buffering = 32768

# Logging
logto = /var/log/uwsgi.log

# Worker limits
max-requests = 100
harakiri = 90
min-worker-lifetime = 5
max-worker-lifetime = 14400
max-worker-lifetime-delta = 60

# Remove these deprecated options:
# skip-atexit-teardown = true  <- CAUSES EXIT 22
# skip-atexit = true            <- CAUSES EXIT 22